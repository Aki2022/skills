# 第三者 skill の再インストール台帳。
#
# 正典 ~/.agents/skills/ は「全エージェント共通の配線ハブ」であって、git リポジトリと
# 同一ではない。PUBLIC な Aki2022/skills に置くのは自作（own-*）だけとし、第三者は
# .gitignore で追跡しない（2026-09-23 決定）。
#
# したがって第三者の復旧手段は git ではなくこの台帳だけになる。各エントリは
# 「どこから・どの版を・どうやって入れ直すか」を記録する。記録の無い第三者 skill は
# 消えたら戻せない。
#
# 中身は上流とバイト同一に保つ。改変が要るなら fork として own-<対象>-<動作> を作る。
mirrors:
  - dir: agent-browser
    upstream: vercel-labs/agent-browser
    upstream_path: skills/agent-browser
    upstream_version: unknown（取得時の版を記録していない）
    fetched_at: 2026-08-01
    license: 記載なし（明示の許諾なし＝既定では全権留保）
    reinstall: npx degit vercel-labs/agent-browser/skills/agent-browser ~/.agents/skills/agent-browser
    note: ローカルは上流より古い版

# 例：seg-0002 の positioning に立つ資料の台本。同じ固定値を使い、別の一番のメッセージと並びで話す。
# 証拠と声のまとまりの文案は、立っている positioning の証拠（refs）を引く。
schema_version: 1
id: deck-smb
channel: deck
outputs:
- decks/smb.pptx
target:
  segment: seg-0002
  condition: 人手が足りない中小企業の経営者
touchpoint: deck
tone: 端的で親しみやすい調子
objective:
  id: obj-0001
  action: 問い合わせ
messages:
  msg-0001:
    value: val-0002
    rank: lead
    type: normal
  msg-0002:
    value: val-0002
    rank: support
    type: cta
    achieves: obj-0001
blocks:
  blk-0001:
    order: 1
    function: claim
    places:
    - msg-0001
  blk-0002:
    order: 2
    function: evidence
  blk-0003:
    order: 3
    function: action
    places:
    - msg-0002
copies:
  cpy-0001:
    block: blk-0001
    order: 1
    message: msg-0001
    text: '{{value-customer-count}}が導入、少人数でも回ります'
  cpy-0004:
    block: blk-0002
    order: 1
    refs:
    - prf-0002
    text: 導入前後で運用の時間を比べました
  cpy-0002:
    block: blk-0003
    order: 1
    text: 少人数で回す仕組みを
  cpy-0003:
    block: blk-0003
    order: 2
    message: msg-0002
    text: お問い合わせ {{value-phone}}

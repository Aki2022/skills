# 例：seg-0001 の positioning に立つ LP の台本。target・接点・トーンと取ってほしい行動を固定し、メッセージ・まとまり・文案を組み立てる。
# まとまりは内容の働き（名乗り・主張・事実・証拠と声・提供条件・行動・出典と運営者）を 1 つずつ持ち、数と順は自由。
# メッセージを置けるのは主張（通常のメッセージをちょうど 1 つ）と行動（CTA を 0〜1 つ）のまとまりだけ。
# 文案は引き先（伝えるメッセージ・positioning の証拠 refs・辞書の値 {{value-…}}）を持つか、提案の印（proposal: true）を持つ。
schema_version: 1
id: lp-municipal
channel: web
outputs:
- site/index.html
target:
  segment: seg-0001
  condition: 既存システムの運用が重いと感じている情報部門の担当者
touchpoint: lp
tone: 丁寧で落ち着いた調子
objective:
  id: obj-0001
  action: 資料請求
messages:
  msg-0001:
    value: val-0001
    rank: lead
    type: normal
    compares:
    - alt-0001
  msg-0002:
    value: val-0003
    rank: support
    type: normal
  msg-0003:
    value: val-0001
    rank: support
    type: cta
    achieves: obj-0001
blocks:
  blk-0001:
    order: 1
    function: claim
    places:
    - msg-0001
  blk-0002:
    order: 2
    function: claim
    places:
    - msg-0002
  blk-0003:
    order: 3
    function: evidence
  blk-0004:
    order: 4
    function: action
    places:
    - msg-0003
  blk-0005:
    order: 5
    function: source
copies:
  cpy-0001:
    block: blk-0001
    order: 1
    message: msg-0001
    text: 既存システムの運用、重くありませんか
  cpy-0002:
    block: blk-0001
    order: 2
    message: msg-0001
    text: 運用の手間が半分になります
  cpy-0003:
    block: blk-0002
    order: 1
    message: msg-0002
    text: 導入は{{value-customer-count}}、止まらずに動き続けます
  cpy-0006:
    block: blk-0003
    order: 1
    refs:
    - prf-0001
    - prf-0003
    text: 導入した自治体の数と、自動更新の稼働記録を公開しています
  cpy-0004:
    block: blk-0004
    order: 1
    text: 保守の要らない運用へ
  cpy-0005:
    block: blk-0004
    order: 2
    message: msg-0003
    text: 資料請求はこちら（{{value-phone}}）
  cpy-0007:
    block: blk-0005
    order: 1
    text: お問い合わせ {{value-phone}}

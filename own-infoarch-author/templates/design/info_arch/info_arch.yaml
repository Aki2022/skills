# design/info_arch/info_arch.yaml — 伝え方の SSOT（スキーマ版 4）
# positioning の原子：segments（セグメント）・jobs（ジョブ）・pains（痛み）・gains（得たいもの）・alternatives（代替）・
#   categories（カテゴリー）・strengths（強み）・values（提供価値。kind: difference / parity）。証拠は proofs に segment を書く。
#   原子は 1 つのセグメントにだけ属する（segment）。別のセグメントで使うときは写しを作り、出どころを copied_from に書く。
# positioning の矢印：edges（kind・from・to。fulfills だけ degree: full / partial / none を持つ）。
#   has_job（seg→job）・need（job→pan/gan）・fulfills（alt→pan/gan）・recalls（job→cat）・includes（cat→alt）・
#   member_of（seg→cat、ちょうど 1 本）・lacks（str→alt）・produces（str→val）・satisfies（val→pan/gan）・supports（prf→原子・矢印）。
# 隙間と同等であるべき点は書かない（承認済みの矢印から導く）。承認はオーナーが原子と矢印ごとに承認台帳に記録する。
# 伝え方（outline へ移るまで）：audiences（対象者）・messages（メッセージ）・proofs（証拠）・facts（固定値）・entities（正式名称）・voices（声）。
# id は ledger.next から発行し、再利用しない。改名・削除は tombstones（旧 id → 新 id、削除は null）。
# state は empty / proposed だけ。値の出所は provenance に書く。
schema_version: 4
ledger:
  next: {aud: 1, msg: 1, prf: 1, fct: 1, ent: 1, vce: 1, seg: 1, job: 1, pan: 1, gan: 1, alt: 1, cat: 1, str: 1, val: 1}
  tombstones: {}
segments: {}
jobs: {}
pains: {}
gains: {}
alternatives: {}
categories: {}
strengths: {}
values: {}
edges: []
audiences: {}
messages: {}
proofs: {}
facts: {}
entities: {}
voices: {}

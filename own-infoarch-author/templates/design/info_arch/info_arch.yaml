# design/info_arch/info_arch.yaml — 伝え方の SSOT（スキーマ版 3）
# 戦略の層：segments（セグメント）・jobs（ジョブ）・pains（痛み）・gains（得たいもの）・values（提供価値）・
#   alternatives（代替）・strengths（強み）・concepts（カテゴリーとコンセプト）・promises（約束）。確定はオーナーが承認台帳に記録する。
# 伝え方：audiences（対象者）・messages（メッセージ）・proofs（証拠）・facts（固定値）・entities（正式名称）・voices（声）。
# メッセージは serves で担う戦略の原子を結ぶ。対象者は segment でセグメントを結ぶ。
# id は ledger.next から発行し、再利用しない。改名・削除は tombstones（旧 id → 新 id、削除は null）。
# state は empty / proposed だけ。値の出所は provenance に書く。
schema_version: 3
ledger:
  next: {aud: 1, msg: 1, prf: 1, fct: 1, ent: 1, vce: 1, seg: 1, job: 1, pan: 1, gan: 1, val: 1, alt: 1, str: 1, cpt: 1, prm: 1}
  tombstones: {}
segments: {}
jobs: {}
pains: {}
gains: {}
values: {}
alternatives: {}
strengths: {}
concepts: {}
promises: {}
audiences: {}
messages: {}
proofs: {}
facts: {}
entities: {}
voices: {}
